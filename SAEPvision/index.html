<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEPVision - Sistema de Avaliação Prática</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 1px solid #e0e0e0;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-section img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-black {
            background-color: #000000;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-black:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .company-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }

        
        .search-container {
            position: relative;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #000000;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-container .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background-color: #FFFFFF;
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        
        .tooltip {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            color: #FFFFFF;
            padding: 10px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card-img-wrapper:hover .tooltip {
            opacity: 1;
        }

        .card-info {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
        }

        .like-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .like-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #000000;
        }

        .like-icon.active {
            fill: #FF0000;
            stroke: #FF0000;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #FF0000;
            cursor: pointer;
            margin-left: 10px;
        }

        
        .upload-section {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px dashed #000000;
        }

        
        footer {
            background-color: #000000;
            color: #FFFFFF;
            padding: 25px 0;
            text-align: center;
            margin-top: auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .social-links a {
            color: #FFFFFF;
            text-decoration: none;
        }

        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .error-message {
            color: #FF0000;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-section">
            <img src="https://via.placeholder.com/45" id="user-avatar" alt="Foto Perfil">
            <span id="user-name">@SAEPVision</span>
            <button id="btn-perfil" class="btn-black" disabled>Ver Perfil</button>
        </div>
        <div class="company-title">SAEPVision</div>
        <button id="btn-login-trigger" class="btn-black" onclick="openModal()">Login</button>
    </header>

    
    <main>
        
        <section id="upload-form-container" class="upload-section" style="display: none;">
            <h3>Nova Publicação (Área do Fotógrafo)</h3>
            <form id="form-upload" onsubmit="handleUpload(event)">
                <div class="form-group" style="margin-top: 10px;">
                    <label>Título da Foto:</label>
                    <input type="text" id="upload-titulo" required>
                </div>
                <div class="form-group">
                    <label>Localização:</label>
                    <input type="text" id="upload-localizacao" required>
                </div>
                <div class="form-group">
                    <label>Selecione a Imagem (JPG, PNG, GIF, WEBP):</label>
                    <input type="file" id="upload-file" accept=".jpg,.jpeg,.png,.gif,.webp" required>
                </div>
                <button type="submit" class="btn-black">Publicar Imagem</button>
            </form>
        </section>

        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Digite o nome do fotógrafo... ex: @fotografo1" onkeyup="filterPhotos()">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        
        <div class="gallery" id="photo-gallery">
            
        </div>
    </main>

    
    <div class="modal-overlay" id="login-modal">
        <div class="modal">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>Autenticação</h2>
            <form id="login-form" onsubmit="handleLogin(event)" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                    <span class="error-message" id="email-error">Formato de e-mail inválido.</span>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required placeholder="Digite sua senha">
                    <span class="error-message" id="senha-error">A senha é obrigatória.</span>
                </div>
                <button type="submit" class="btn-black" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    
    <footer>
        <p>&copy; 2026/2027 SAEPVision - Todos os direitos reservados.</p>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
            <a href="#">LinkedIn</a>
            <a href="#">YouTube</a>
        </div>
    </footer>

    
    <script>
        
        let currentUser = null;
        let photos = [];

        
        document.addEventListener('DOMContentLoaded', () => {
            fetchPhotos();
        });

        
        async function fetchPhotos() {
            try {
                const response = await fetch('/api/publicacoes');
                photos = await response.json();
                renderGallery(photos);
            } catch (err) {
                console.error("Erro ao carregar fotos dinamicamente:", err);
            }
        }

        
        function renderGallery(items) {
            const gallery = document.getElementById('photo-gallery');
            gallery.innerHTML = '';

            items.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';

                
                const isOwner = currentUser && currentUser.tipo === 'FOTOGRAFO' && currentUser.id === photo.fotografoId;

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${photo.imagemUrl}" alt="${photo.titulo}">
                        <div class="tooltip">
                            <strong>${photo.fotografoNome}</strong><br>
                            📍 ${photo.localizacao}
                        </div>
                    </div>
                    <div class="card-info">
                        <span class="card-title">${photo.titulo}</span>
                        <div style="display: flex; align-items: center;">
                            <div class="like-container" onclick="toggleLike(${photo.id})">
                                <svg class="like-icon ${photo.likedByMe ? 'active' : ''}" viewBox="0 0 24 24">
                                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                </svg>
                                <span>${photo.curtidasCount}</span>
                            </div>
                            ${isOwner ? `
                                <button class="btn-delete" onclick="deletePhoto(${photo.id})" title="Excluir Imagem">
                                    🗑️
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        
        function filterPhotos() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = photos.filter(p => p.fotografoNome.toLowerCase().includes(query));
            renderGallery(filtered);
        }

        
        function openModal() {
            document.getElementById('login-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            
            if (!email.includes('@')) {
                document.getElementById('email-error').style.display = 'block';
                return;
            } else {
                document.getElementById('email-error').style.display = 'none';
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                if (res.ok) {
                    currentUser = await res.json();
                    updateUserUI();
                    closeModal();
                    fetchPhotos(); 
                } else {
                    alert('Credenciais inválidas!');
                }
            } catch (err) {
                console.error("Erro na autenticação:", err);
            }
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('user-name').innerText = currentUser.nome;
                document.getElementById('user-avatar').src = currentUser.fotoPerfil || 'https://via.placeholder.com/45';
                
                const btnPerfil = document.getElementById('btn-perfil');
                btnPerfil.disabled = false;

                document.getElementById('btn-login-trigger').innerText = 'Sair';
                document.getElementById('btn-login-trigger').onclick = logout;

                if (currentUser.tipo === 'FOTOGRAFO') {
                    document.getElementById('upload-form-container').style.display = 'block';
                }
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('user-name').innerText = '@SAEPVision';
            document.getElementById('user-avatar').src = 'https://via.placeholder.com/45';
            document.getElementById('btn-perfil').disabled = true;
            document.getElementById('btn-login-trigger').innerText = 'Login';
            document.getElementById('btn-login-trigger').onclick = openModal;
            document.getElementById('upload-form-container').style.display = 'none';
            fetchPhotos();
        }

        
        async function toggleLike(photoId) {
            if (!currentUser) {
                openModal();
                return;
            }

            await fetch(`/api/publicacoes/${photoId}/curtir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuarioId: currentUser.id })
            });

            fetchPhotos();
        }

        
        async function deletePhoto(photoId) {
            if (confirm("Tem certeza que deseja excluir esta foto?")) {
                await fetch(`/api/publicacoes/${photoId}`, { method: 'DELETE' });
                fetchPhotos();
            }
        }

        
        async function handleUpload(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('titulo', document.getElementById('upload-titulo').value);
            formData.append('localizacao', document.getElementById('upload-localizacao').value);
            formData.append('imagem', document.getElementById('upload-file').files[0]);
            formData.append('fotografoId', currentUser.id);

            await fetch('/api/publicacoes', {
                method: 'POST',
                body: formData
            });

            document.getElementById('form-upload').reset();
            fetchPhotos();
        }
    </script>
</body>
</html>
